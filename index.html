<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aryan AI Agency</title>
<style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:auto;padding:28px}
.card{background:#121a2e;border:1px solid #263352;border-radius:18px;padding:22px;margin-top:18px}
h1{margin:0 0 8px;font-size:32px}.muted{color:#9eabc8}
select,textarea,button{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #344263;background:#0e1528;color:#fff;padding:13px;margin-top:10px}
textarea{min-height:150px;resize:vertical}button{cursor:pointer;font-weight:700;background:#263b72}
pre{white-space:pre-wrap;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:15px}
.pill{padding:12px;border:1px solid #2d3b5d;border-radius:12px;background:#0e1528}
</style>
</head>
<body>
<div class="wrap">
<h1>⚡ Aryan AI Agency</h1>
<div class="muted">Professional multi-agent workspace · free-first foundation</div>

<div class="card">
<label>Choose specialist</label>
<select id="agent">
<option value="master">Aryan CEO</option>
<option value="research">Research Agent</option>
<option value="business">Business Agent</option>
<option value="data">Data & Excel Agent</option>
<option value="coding">Coding Agent</option>
<option value="documents">Document Agent</option>
<option value="qa">QA & Fact Checker</option>
</select>

<label>Your task</label>
<textarea id="task" placeholder="Example: Create a professional market research brief for an AI automation agency..."></textarea>
<button onclick="runTask()">Run Agent</button>
</div>

<div class="card">
<h2>Agent workforce</h2>
<div class="grid" id="agents"></div>
</div>

<div class="card">
<h2>Result</h2>
<pre id="result">Ready.</pre>
</div>
</div>
<script>
async function loadAgents(){
 const r=await fetch('/api/agents'); const a=await r.json();
 document.getElementById('agents').innerHTML=Object.entries(a).map(([k,v])=>`<div class="pill">${v}</div>`).join('');
}
async function runTask(){
 const result=document.getElementById('result');
 result.textContent='Working...';
 const message=document.getElementById('task').value.trim();
 const agent=document.getElementById('agent').value;
 if(!message){result.textContent='Enter a task first.';return;}
 try{
  const r=await fetch('/api/task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,agent})});
  const d=await r.json();
  result.textContent=d.answer || d.message || JSON.stringify(d,null,2);
 }catch(e){result.textContent='Request failed: '+e}
}
loadAgents();
</script>
</body>
</html>
